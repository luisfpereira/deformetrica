[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "deformetrica"
dynamic = ["version"]
description = "Software for the statistical analysis of 2D and 3D shape data."
readme = "README.md"
license = { text = "INRIA license" }

authors = [{ name = "ARAMIS Lab" }]

maintainers = [
    { name = "Deformetrica developers", email = "deformetrica.team@gmail.com" },
]

dependencies = ["pykeops==1.0.1", "gputil>=1.3"]

classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries",
]


[project.urls]
Homepage = "http://www.deformetrica.org"


[project.scripts]
deformetrica = "deformetrica:main"


[tool.setuptools.dynamic]
version = { attr = "deformetrica.__version__" }


[tool.setuptools.packages.find]
where = ["."]
exclude = ["deformetrica.gui", "deformetrica.gui.*"]


[tool.setuptools.package-data]
"*" = ["*.json", "*.png"]
